<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهارة | قائمة الانتظار</title>
<meta name="description" content="منصة مهارة لمواهب السودان. سجّل في قائمة الانتظار وكن أول من يدخل.">
<style>
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('IBMPlexSansArabic-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('IBMPlexSansArabic-SemiBold.ttf') format('truetype');font-weight:500 600;font-display:swap;}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('IBMPlexSansArabic-Bold.ttf') format('truetype');font-weight:700 800;font-display:swap;}
  :root{--primary:#1f7a5c;--primary-dark:#146a5b;--bg:#faf6ee;--surface:#ffffff;--text:#1d2a25;--muted:#6b7a74;--border:#e4dccb;--gold:#e0b25a;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Arabic',-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .wrap{max-width:460px;margin:0 auto;padding:28px 20px 40px;}
  .hero{background:linear-gradient(160deg,var(--primary),var(--primary-dark));color:#fff;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 18px 36px -22px var(--primary);}
  .logo{width:72px;height:72px;margin:0 auto 10px;}
  .brand{font-size:30px;font-weight:800;margin:0;}
  .tag{color:var(--gold);font-size:14px;margin-top:4px;}
  h1{font-size:20px;margin:22px 0 6px;text-align:center;}
  .lead{color:var(--muted);text-align:center;line-height:1.8;margin:0 0 18px;font-size:15px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 8px 20px -16px rgba(60,40,10,.35);}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px;}
  input[type=text],input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:15px;background:#fff;color:var(--text);}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,122,92,.18);}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .role{border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;background:#fff;}
  .role input{display:none;}
  .role.on{border-color:var(--primary);background:rgba(31,122,92,.08);color:var(--primary);}
  button{width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 22px -12px var(--primary);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px;}
  .msg.err{color:#b3261e;}
  .done{text-align:center;padding:10px 0;}
  .done .check{font-size:44px;}
  .count{text-align:center;color:var(--muted);font-size:14px;margin-top:16px;}
  .count b{color:var(--primary);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="80" cy="100" r="40" fill="none" stroke="#E0B25A" stroke-width="13"/>
      <circle cx="120" cy="100" r="40" fill="none" stroke="#E0B25A" stroke-width="13"/>
      <circle cx="100" cy="100" r="9" fill="#F5EBD8"/>
    </svg>
    <p class="brand">مهارة</p>
    <div class="tag">منصة مواهب السودان</div>
  </div>

  <h1>كن من أول الداخلين</h1>
  <p class="lead">سجّل بياناتك وبنبلغك أول ما المنصة تفتح. إذا أنت مستقل، بتقدر تعرض خدماتك قبل الناس، وإذا أنت عميل، بتلاقي مواهب سودانية تشتغل معك.</p>

  <div class="card" id="formCard">
    <form id="wForm" novalidate>
      <label for="wName">الاسم</label>
      <input type="text" id="wName" maxlength="60" autocomplete="name" placeholder="اسمك الكامل">

      <label for="wEmail">الإيميل</label>
      <input type="email" id="wEmail" maxlength="120" autocomplete="email" dir="ltr" placeholder="you@example.com">

      <label>أنت</label>
      <div class="roles">
        <label class="role on" data-role="freelancer"><input type="radio" name="role" value="freelancer" checked>مستقل (أعرض خدماتي)</label>
        <label class="role" data-role="client"><input type="radio" name="role" value="client">عميل (أبحث عن خدمة)</label>
      </div>

      <button type="submit" id="wBtn">انضم لقائمة الانتظار</button>
      <div class="msg" id="wMsg"></div>
    </form>
  </div>

  <div class="card done hidden" id="doneCard">
    <div class="check">✅</div>
    <h1 style="margin:8px 0 6px;">تم تسجيلك</h1>
    <p class="lead" style="margin:0;">بنوصلك على الإيميل أول ما نفتح. شكراً لك.</p>
  </div>

  <div class="count" id="countLine"></div>
</div>

<script>
  const API_URL = 'https://zrgxdkwvlpddpvyjmvox.supabase.co/functions/v1/mahara-api';
  const $ = (id) => document.getElementById(id);

  document.querySelectorAll('.role').forEach((el) => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.role').forEach((x) => x.classList.remove('on'));
      el.classList.add('on');
      el.querySelector('input').checked = true;
    });
  });

  async function api(payload) {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(payload) });
    return r.json();
  }

  function showMsg(text, isErr) {
    const m = $('wMsg');
    m.textContent = text;
    m.className = 'msg' + (isErr ? ' err' : '');
  }

  $('wForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('wName').value.trim();
    const email = $('wEmail').value.trim();
    const role = document.querySelector('input[name="role"]:checked').value;
    if (name.length < 2) return showMsg('اكتب اسمك', true);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('اكتب إيميل صحيح', true);

    const btn = $('wBtn');
    btn.disabled = true;
    showMsg('جاري التسجيل...', false);
    try {
      const res = await api({ action: 'waitlistJoin', name, email, role });
      if (res && res.ok) {
        $('formCard').classList.add('hidden');
        $('doneCard').classList.remove('hidden');
        loadCount();
      } else {
        showMsg('صار خطأ، حاول مرة ثانية', true);
        btn.disabled = false;
      }
    } catch (err) {
      showMsg('تعذّر الاتصال، تأكد من النت وحاول مرة ثانية', true);
      btn.disabled = false;
    }
  });

  async function loadCount() {
    try {
      const res = await api({ action: 'waitlistCount' });
      if (res && res.ok && res.count > 0) {
        $('countLine').innerHTML = 'انضم <b>' + res.count + '</b> شخص لقائمة الانتظار';
      }
    } catch (e) {}
  }
  loadCount();
</script>
</body>
</html>
