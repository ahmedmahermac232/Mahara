<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهارة | Mahara</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='bgGradB' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23146A5B'/%3E%3Cstop offset='100%25' stop-color='%230B4038'/%3E%3C/linearGradient%3E%3ClinearGradient id='ringGradB' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23E0B25A'/%3E%3Cstop offset='100%25' stop-color='%23C68A2E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='0' y='0' width='200' height='200' rx='46' fill='url(%23bgGradB)'/%3E%3Ccircle cx='80' cy='100' r='40' fill='none' stroke='url(%23ringGradB)' stroke-width='13'/%3E%3Ccircle cx='120' cy='100' r='40' fill='none' stroke='url(%23ringGradB)' stroke-width='13'/%3E%3Ccircle cx='100' cy='100' r='9' fill='%23F5EBD8'/%3E%3C/svg%3E">
<style>
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('IBMPlexSansArabic-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('IBMPlexSansArabic-SemiBold.ttf') format('truetype');font-weight:500 600;font-style:normal;font-display:swap;}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('IBMPlexSansArabic-Bold.ttf') format('truetype');font-weight:700 800;font-style:normal;font-display:swap;}
  :root{
    --bg:#FBF6EC; --surface:#FFFFFF; --primary:#0F5C4E; --primary-dark:#0B4038;
    --accent:#C68A2E; --text:#23201B; --muted:#8A8270; --border:#E4D9C2; --danger:#B0452E; --radius:8px;
  }
  body.dark{
    --bg:#14201C; --surface:#1C2A25; --primary:#3FA98D; --primary-dark:#2E8670;
    --accent:#E0B25A; --text:#EDE7D8; --muted:#96A199; --border:#2E3B35; --danger:#E0806A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Tahoma,Geneva,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;transition:background .2s,color .2s;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
  img{max-width:100%;display:block;}

  .header{padding:16px 16px 12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .brand{display:flex;flex-direction:column;}
  .brand-name{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-0.5px;display:flex;align-items:center;gap:6px;}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;}
  .brand-mark{width:30px;height:30px;flex-shrink:0;}
  .tagline{font-size:12px;color:var(--muted);margin-top:2px;}
  .header-actions{display:flex;align-items:center;gap:6px;}
  .icon-btn{
    border:1px solid var(--border);background:var(--surface);border-radius:8px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--text);flex-shrink:0;
  }
  .profile-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--text);}
  .profile-chip b{color:var(--primary);font-weight:700;}
  .tabs{display:flex;gap:4px;margin-top:12px;}
  .tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);}

  .content{flex:1;padding:14px 16px 90px;}
  .search-input,.field input,.field textarea,.field select{
    width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius);
    font-size:14px;background:var(--surface);color:var(--text);font-family:inherit;
  }
  .search-input:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);}
  .chips{display:flex;gap:7px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--border);font-size:12px;
    color:var(--text);background:var(--surface);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .service-row{padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;}
  .service-row:active{background:rgba(15,92,78,0.06);}
  .service-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--border);}
  .service-thumb-placeholder{width:56px;height:56px;border-radius:8px;background:var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px;}
  .service-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .service-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .service-name{font-size:14.5px;font-weight:700;color:var(--text);}
  .service-price{font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap;}
  .service-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
  .tag{background:var(--border);color:var(--primary-dark);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;}
  .service-desc{font-size:12.5px;color:var(--muted);line-height:1.5;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-icon{font-size:32px;margin-bottom:10px;}
  .empty-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;}
  .empty-sub{font-size:13px;line-height:1.6;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:var(--radius);
    font-size:14.5px;font-weight:700;border:none;cursor:pointer;font-family:inherit;width:100%;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-secondary{background:var(--surface);color:var(--primary);border:1px solid var(--primary);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .link-btn{color:var(--primary);font-size:13px;font-weight:700;background:none;border:none;font-family:inherit;
    padding:0;cursor:pointer;text-decoration:underline;}

  .back-link{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13.5px;margin-bottom:14px;cursor:pointer;}
  .detail-title{font-size:19px;font-weight:800;margin-bottom:8px;}
  .detail-provider{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .detail-image{width:100%;border-radius:var(--radius);margin-bottom:14px;max-height:220px;object-fit:cover;}
  .detail-price-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .detail-price{font-size:19px;font-weight:800;color:var(--accent);}
  .detail-desc{font-size:14px;line-height:1.8;color:var(--text);margin-bottom:22px;white-space:pre-wrap;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text);}
  .field textarea{resize:vertical;min-height:110px;line-height:1.6;}
  .word-count{font-size:12px;margin-top:5px;color:var(--muted);}
  .word-count.ok{color:var(--primary);font-weight:700;}
  .word-count.low{color:var(--danger);}
  .radio-group{display:flex;gap:10px;}
  .radio-option{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;
    cursor:pointer;font-size:13px;font-weight:600;}
  .radio-option.selected{border-color:var(--primary);background:rgba(15,92,78,0.08);color:var(--primary);}

  .my-service-row{border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:10px;}
  .my-service-body{flex:1;min-width:0;}
  .my-service-actions{display:flex;gap:8px;margin-top:10px;}
  .my-service-actions .btn{padding:8px 10px;font-size:12px;}

  .order-row{border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:10px;background:var(--surface);}
  .order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .order-service{font-weight:700;font-size:14px;}
  .status-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .status-pending{background:#F6E9CF;color:#8A5A16;}
  .status-in_progress{background:#DCEAE4;color:#0B4038;}
  .status-done{background:#E1E9D6;color:#4A6B2A;}
  body.dark .status-pending{background:#4A3B1C;color:#F0C878;}
  body.dark .status-in_progress{background:#1F3A32;color:#7FD9BE;}
  body.dark .status-done{background:#2A3820;color:#B7D18E;}
  .order-sub{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .order-section-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px;}

  .auth-wrap{padding:44px 22px;}
  .onboard-logo{font-size:32px;font-weight:800;color:var(--primary);margin-bottom:6px;text-align:center;}
  .onboard-tag{font-size:13.5px;color:var(--muted);margin-bottom:30px;line-height:1.7;text-align:center;}
  .auth-form{text-align:start;}
  .auth-switch{text-align:center;margin-top:16px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
    padding:11px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,0.25);
    max-width:90%;text-align:center;}

  /* ---- visual refresh ---- */
  body{font-family:'IBM Plex Sans Arabic',-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;}
  .header{background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:none;box-shadow:0 1px 0 var(--border);}
  .brand-name{font-weight:800;}
  .tab{font-size:14px;padding:11px 4px;border-bottom-width:3px;border-radius:8px 8px 0 0;transition:color .15s,background .15s;}
  .tab.active{background:linear-gradient(to top,color-mix(in srgb, var(--primary) 8%, transparent),transparent);}
  .icon-btn,.profile-chip{box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .12s,background .15s;}
  .icon-btn:active,.profile-chip:active{transform:scale(.96);}
  .content{padding-top:18px;}
  .search-input,.field input,.field textarea,.field select{border-radius:12px;padding:12px 14px;transition:border-color .15s,box-shadow .15s;}
  .search-input:focus,.field input:focus,.field textarea:focus,.field select:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);}
  .chip{border-radius:999px;font-weight:600;transition:transform .12s;}
  .chip:active{transform:scale(.97);}
  .service-row{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,40,10,.04),0 8px 20px -14px rgba(60,40,10,.25);transition:transform .15s,box-shadow .15s;}
  .service-row:active{transform:translateY(1px);background:var(--surface);}
  .service-thumb,.service-thumb-placeholder{border-radius:12px;width:64px;height:64px;}
  .service-thumb-placeholder{background:linear-gradient(135deg,var(--border),var(--bg));}
  .service-name{font-size:15px;font-weight:700;}
  .service-price{font-size:14px;background:color-mix(in srgb, var(--accent) 14%, transparent);padding:3px 9px;border-radius:999px;}
  .tag{border-radius:999px;background:color-mix(in srgb, var(--primary) 10%, transparent);color:var(--primary);}
  .btn{border-radius:14px;padding:13px 18px;font-weight:700;transition:transform .12s,background .15s,box-shadow .15s;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 10px 22px -12px var(--primary);}
  .btn-primary:active{transform:scale(.98);}
  .btn-secondary{border-radius:14px;}
  .my-service-row,.order-row{border-radius:16px;border-color:var(--border);box-shadow:0 1px 2px rgba(60,40,10,.04),0 8px 20px -14px rgba(60,40,10,.25);}
  .order-row{padding:14px;}
  .detail-price-box,.detail-image{border-radius:16px;}
  .radio-option{border-radius:14px;}
  .empty{padding:56px 24px;}
  .empty-icon{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:color-mix(in srgb, var(--primary) 10%, transparent);display:flex;align-items:center;justify-content:center;font-size:32px;}
  .empty-title{font-size:16px;}
  .detail-title{font-size:20px;font-weight:800;letter-spacing:-0.2px;}
  .back-link{font-weight:600;}
  .profile-hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:20px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;box-shadow:0 16px 32px -20px var(--primary);}
  .profile-hero .hero-name{font-size:19px;font-weight:800;margin-top:8px;}
  .profile-hero .hero-mail{font-size:13px;opacity:.85;}
  .profile-hero img{border:3px solid rgba(255,255,255,.45);}
  .acc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(60,40,10,.04);transition:transform .12s,background .15s;}
  .acc-row:active{transform:scale(.99);background:color-mix(in srgb, var(--primary) 6%, var(--surface));}
  .acc-icon{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .acc-icon svg{width:20px;height:20px;}
  .acc-label{flex:1;font-weight:600;font-size:15px;}
  .acc-chev{color:var(--muted);font-size:20px;}
  .tabs{display:none !important;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;z-index:20;
    display:flex;justify-content:space-around;align-items:flex-end;gap:2px;
    background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;cursor:pointer;color:var(--muted);min-width:0;}
  .bn-ico{width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .bn-ico svg{width:22px;height:22px;}
  .bn-label{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .bn-item.active{color:var(--primary);}
  .bn-item.active .bn-ico{background:color-mix(in srgb, var(--primary) 14%, transparent);}
  .bn-item:active .bn-ico{transform:scale(.94);}
  @keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
  #root[data-anim="1"] .content{animation:pageIn .38s cubic-bezier(.2,.7,.2,1) both;}
  #root[data-anim="1"] .service-row,#root[data-anim="1"] .my-service-row,#root[data-anim="1"] .order-row,#root[data-anim="1"] .acc-row{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;}
  #root[data-anim="1"] .service-row:nth-child(2),#root[data-anim="1"] .my-service-row:nth-child(2),#root[data-anim="1"] .order-row:nth-child(2),#root[data-anim="1"] .acc-row:nth-child(2){animation-delay:.05s;}
  #root[data-anim="1"] .service-row:nth-child(3),#root[data-anim="1"] .my-service-row:nth-child(3),#root[data-anim="1"] .order-row:nth-child(3),#root[data-anim="1"] .acc-row:nth-child(3){animation-delay:.1s;}
  #root[data-anim="1"] .service-row:nth-child(4),#root[data-anim="1"] .my-service-row:nth-child(4),#root[data-anim="1"] .order-row:nth-child(4),#root[data-anim="1"] .acc-row:nth-child(4){animation-delay:.15s;}
  #root[data-anim="1"] .service-row:nth-child(5),#root[data-anim="1"] .my-service-row:nth-child(5),#root[data-anim="1"] .order-row:nth-child(5),#root[data-anim="1"] .acc-row:nth-child(5){animation-delay:.2s;}
  #root[data-anim="1"] .service-row:nth-child(n+6),#root[data-anim="1"] .my-service-row:nth-child(n+6),#root[data-anim="1"] .order-row:nth-child(n+6),#root[data-anim="1"] .acc-row:nth-child(n+6){animation-delay:.25s;}
  #root[data-anim="1"] .profile-hero{animation:pop .45s cubic-bezier(.2,.7,.2,1) both;}
  #root[data-anim="1"] .bottom-nav{animation:rise .4s ease both;}
  .bn-ico{transition:background .2s,transform .2s;}
  @media (prefers-reduced-motion: reduce){ #root *{animation:none !important;transition:none !important;} }
  .auth-top{display:flex;justify-content:flex-end;padding:14px 16px 0;}
  .lang-pill{border:1px solid var(--border);background:var(--surface);color:var(--primary);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#146A5B 0%,#0B4038 100%);color:#F5EBD8;}
  .splash-logo{width:130px;height:130px;animation:splashPop .7s cubic-bezier(.2,.8,.2,1) both;}
  .splash-logo .ring{stroke-dasharray:260;stroke-dashoffset:260;animation:ringDraw 1.1s ease .2s forwards;}
  .splash-logo .ring2{animation-delay:.4s;}
  .splash-logo .dot{transform-box:fill-box;transform-origin:center;animation:dotPulse 1.2s ease 1s infinite alternate;}
  .splash-name{font-size:34px;font-weight:800;margin-top:18px;opacity:0;animation:fadeUp .6s ease .9s forwards;}
  .splash-tag{font-size:14px;margin-top:6px;color:#E0B25A;opacity:0;animation:fadeUp .6s ease 1.1s forwards;}
  @keyframes splashPop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes ringDraw{to{stroke-dashoffset:0;}}
  @keyframes dotPulse{from{transform:scale(1);}to{transform:scale(1.3);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .splash *{animation:none !important;} .splash-name,.splash-tag{opacity:1;} .splash-logo .ring{stroke-dashoffset:0;} }
  .skel{background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:8px;}
  .skel-card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:12px;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}

  .success-pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);z-index:200;animation:fadeIn .2s ease;transition:opacity .3s;}
  .success-pop.out{opacity:0;}
  .success-card{background:var(--surface);color:var(--text);border-radius:20px;padding:22px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;box-shadow:0 20px 40px -20px rgba(0,0,0,.4);}
  .check{width:64px;height:64px;}
  .check-circle{fill:none;stroke:var(--primary);stroke-width:3;stroke-dasharray:152;stroke-dashoffset:152;animation:strokeIn .6s ease forwards;}
  .check-mark{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:strokeIn .4s ease .5s forwards;}
  @keyframes strokeIn{to{stroke-dashoffset:0;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .op-track{display:flex;align-items:flex-start;margin:12px 0 8px;}
  .op-step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;}
  .op-dot{width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .4s,color .4s;}
  .op-step.on .op-dot{background:var(--primary);color:#fff;}
  .op-label{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;}
  .op-step.on .op-label{color:var(--text);font-weight:600;}
  .op-line{flex:1;height:3px;background:var(--border);margin:11px 4px 0;border-radius:3px;overflow:hidden;}
  .op-line span{display:block;height:100%;width:0;background:var(--primary);}
  .op-line.on span{width:100%;}
  #root[data-anim="1"] .op-line.on span{animation:lineFill .6s ease both;}
  @keyframes lineFill{from{width:0;}to{width:100%;}}

  #root[data-anim="1"] img{animation:imgIn .5s ease both;}
  @keyframes imgIn{from{opacity:0;}to{opacity:1;}}

  .ptr{position:fixed;top:10px;left:50%;transform:translate(-50%,-48px);width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--primary);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;}
  .ptr svg{width:20px;height:20px;}
  .ptr.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .check-circle,.check-mark{stroke-dashoffset:0;} .op-line.on span{width:100%;} }
</style>

  function compressImage(file, maxSide, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function syncTable(table, arr){
    const prev = synced[table] || {};
    const cur = {};
    const ops = [];
    arr.forEach(x=>{
      cur[x.id] = true;
      if(!(x.id in prev)) ops.push({action:'insert', table, row:toDbRow(table,x)});
      else if(prev[x.id] !== JSON.stringify(x)) ops.push({action:'update', table, id:x.id, fields:toDbRow(table,x)});
    });
    Object.keys(prev).forEach(id=>{ if(!cur[id]) ops.push({action:'delete', table, id}); });
    snapshot(table, arr);
    for(const op of ops){
      const res = await api(op);
      if(!res || !res.ok) throw new Error('sync failed');
    }
  }

        profile = null; view = 'auth'; render();
        return;
      }
    }catch(e){}
    const sess = lsGet('session') || {};
    authToken = sess.token || '';
    profile = (sess.userId && authToken) ? {id:sess.userId, email:sess.email||''} : null;
    if(!profile){ view = 'auth'; render(); return; }
    view = 'loading'; render();
    try{
      await fetchAll();
      lastFetch = Date.now();
    }catch(e){
      profile = null;
      view = 'auth';
      render();
      if(!(e && e.unauthorized)){ showToast(tr('networkError')); }
      return;
    }
    view = profile ? 'home' : 'auth';
    render();
    migrateOwnAvatar();
  }

          const res = await api({action:'update', table:'users', id:u.id, fields:{name:u.name, whatsapp:u.whatsapp, paymentInfo:u.paymentInfo||'', age:u.age||'', city:u.city||'', avatar:u.avatar||''}});
          if(!res || !res.ok) throw new Error('sync failed');
        }
        synced.users[u.id] = sig;
      }
      await syncTable('portfolio', allPortfolioItems());
    }catch(e){ showToast(tr('networkError')); }

  function initPullToRefresh(){
    let startY = null, dist = 0;
    const ptr = document.createElement('div');
    ptr.className = 'ptr';
    ptr.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>`;
    document.body.appendChild(ptr);
    const canStart = ()=> window.scrollY===0 && !!profile && ['home','myservices','portfolio','myorders','notifications','account'].indexOf(view)>-1;
    document.addEventListener('touchstart', e=>{ startY = canStart() ? e.touches[0].clientY : null; dist = 0; }, {passive:true});
    document.addEventListener('touchmove', e=>{
      if(startY===null) return;
      dist = Math.max(0, e.touches[0].clientY - startY);
      ptr.style.transform = `translate(-50%, ${Math.min(dist,110)*0.5 - 40}px)`;
      ptr.style.opacity = Math.min(1, dist/70);
    }, {passive:true});
    document.addEventListener('touchend', async ()=>{
      if(startY===null) return;
      const d = dist; startY = null;
      if(d>70){
        ptr.classList.add('spin');
        ptr.style.transform = 'translate(-50%, 10px)';
        await refreshData();
        ptr.classList.remove('spin');
      }
      ptr.style.opacity = 0;
      ptr.style.transform = 'translate(-50%, -48px)';
    }, {passive:true});
  }

      <div class="content">
        <div class="field" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;">
          <label>${tr('paymentInfoLabel')}</label>
          ${pmDraft.map((m,i)=>`
            <div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;background:var(--bg);">
              <div style="display:flex;gap:8px;align-items:center;">
                <select data-pm-idx="${i}" data-pm-key="type" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);">
                  ${PM_TYPES.map(t=>`<option value="${t}" ${m.type===t?'selected':''}>${tr(PM_LABEL_KEYS[t])}</option>`).join('')}
                </select>
                <button type="button" class="link-btn" data-action="pm-remove" data-idx="${i}">${tr('pmRemove')}</button>
              </div>
              <input type="text" data-pm-idx="${i}" data-pm-key="name" value="${escapeHtml(m.name)}" placeholder="${tr('pmHolderName')}" dir="auto" style="margin-top:8px;">
              <input type="text" data-pm-idx="${i}" data-pm-key="number" value="${escapeHtml(m.number)}" placeholder="${tr('pmNumber')}" dir="ltr" style="margin-top:8px;">
            </div>`).join('')}
          ${pmDraft.length < 5
            ? `<button type="button" class="btn btn-secondary" data-action="pm-add" style="margin-top:10px;">${tr('pmAddMethod')}</button>`
            : `<div style="font-size:12px;color:var(--muted);margin-top:8px;">${tr('pmMax')}</div>`}
          <button type="button" class="btn btn-secondary" data-action="save-payment-info" style="margin-top:10px;">${tr('savePaymentInfo')}</button>

      <div class="content">
        <div class="back-link" data-action="go-myservices">${tr('backBtn')}</div>

          <div class="field">
            <label>${tr('serviceNameLabel')}</label>
            <input type="text" id="sf-name" value="${escapeHtml(sfName)}">

  function renderMyOrders(){
    const placedByMe = orders.filter(o=>o.clientId===profile.id);
    const receivedByMe = orders.filter(o=>o.providerId===profile.id);

    function orderRow(o, isProvider){
      const provider = users.find(u=>u.id===o.providerId);
      const pmList = provider ? parsePaymentMethods(provider.paymentInfo) : [];
      const st = deriveStatus(o);
      const price = Number(o.price) || 0;
      const depositAmt = Number(o.deposit) > 0 ? Number(o.deposit) : Math.round(price/2);
      const finalAmt = Math.max(0, price - depositAmt);
      const isFinalStage = o.paymentStage === 'final';
      const dueAmt = isFinalStage ? finalAmt : depositAmt;
      const dFiles = parseDeliveryFiles(o.deliveryFiles);

      const payInstructions = `
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">${tr('paymentInstructionsTitle')}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;" dir="auto">${pmList.length ? pmList.map(m=>`<div style="margin-bottom:4px;"><b>${tr(PM_LABEL_KEYS[m.type])}:</b> ${escapeHtml([m.name, m.number].filter(Boolean).join(' - '))}</div>`).join('') : tr('noPaymentInfoSet')}</div>
          <div style="font-size:14px;font-weight:700;margin-bottom:8px;">${tr(isFinalStage ? 'finalDueLabel' : 'depositDueLabel')}: ${formatPrice(dueAmt)}</div>
          ${pmList.length ? `
            <input type="text" class="payment-ref-input" data-order-id="${o.id}" placeholder="${tr('transactionRefLabel')}" value="${escapeHtml(paymentRefDrafts[o.id]||'')}" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;background:var(--surface);color:var(--text);">
            <button type="button" class="btn btn-secondary" data-action="submit-payment" data-id="${o.id}" style="margin-top:6px;">${tr('iHavePaid')}</button>` : ''}
        </div>`;

      let stageHtml = '';
      if(st === 'pending'){
        if(isProvider){
          stageHtml = o.providerApproved
            ? `<div class="order-sub" style="margin-top:8px;">${tr('waitingClientApproval')}</div>`
            : `<div class="order-sub" style="margin-top:8px;">${tr('depositSetLabel')}</div>
               <input type="number" min="1" data-deposit-id="${o.id}" value="${depositAmt}" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);margin-top:4px;font-family:inherit;background:var(--surface);color:var(--text);">
               <button type="button" class="btn btn-secondary" data-action="approve-order" data-id="${o.id}" style="margin-top:6px;">${tr('approveOrderBtn')}</button>`;
        } else {
          stageHtml = o.clientApproved
            ? `<div class="order-sub" style="margin-top:8px;">${tr('waitingProviderApproval')}</div>`
            : `<button type="button" class="btn btn-secondary" data-action="client-approve" data-id="${o.id}" style="margin-top:8px;">${tr('clientApproveBtn')}</button>`;
        }
      } else if(st === 'awaiting_deposit' || st === 'awaiting_final'){
        if(o.paymentStatus === 'awaiting_confirmation'){
          stageHtml = isProvider
            ? `<div class="order-sub" style="margin-top:6px;">${tr('referenceWord')}: ${escapeHtml(o.paymentReference)}</div>
               <button type="button" class="btn btn-secondary" data-action="confirm-payment" data-id="${o.id}">${tr('confirmReceiptBtn')}</button>`
            : `<div class="order-sub" style="margin-top:6px;">⏳ ${tr('paymentAwaitingConfirm')}</div>`;
        } else {
          stageHtml = isProvider
            ? `<div class="order-sub" style="margin-top:6px;">${tr('waitingClientPayment')}</div>`
            : payInstructions;
        }
      } else if(st === 'in_progress'){
        if(isProvider && !isFinalStage){
          stageHtml = `<button type="button" class="btn btn-secondary" data-action="request-final" data-id="${o.id}" style="margin-top:8px;">${tr('requestFinalBtn')}</button>`;
        } else {
          stageHtml = `<div class="order-sub" style="margin-top:6px;">${tr('workInProgress')}</div>`;
        }
      } else if(st === 'delivered'){
        const mineDone = isProvider ? o.providerConfirmed : o.clientConfirmed;
        stageHtml = mineDone
          ? `<div class="order-sub" style="margin-top:6px;">${tr('waitingOtherConfirm')}</div>`
          : `<button type="button" class="btn btn-secondary" data-action="${isProvider ? 'provider-confirm' : 'client-confirm'}" data-id="${o.id}" style="margin-top:8px;">${tr(isProvider ? 'providerConfirmBtn' : 'clientConfirmBtn')}</button>`;
      } else if(st === 'done'){
        stageHtml = `<div class="status-badge status-done" style="display:inline-block;margin-top:6px;">✅ ${tr('orderCompletedLabel')}</div>`;
      }

      const fileButtons = (editable) => dFiles.map((f,i)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:6px;font-size:13px;">
          <span style="flex:1;word-break:break-all;">📄 ${escapeHtml(f.name)}</span>
          ${editable
            ? `<button type="button" class="link-btn" data-action="del-delivery-file" data-id="${o.id}" data-idx="${i}">${tr('removeImage')}</button>`
            : `<button type="button" class="link-btn" data-action="dl-delivery-file" data-path="${escapeHtml(f.path)}">${tr('downloadFile')}</button>`}
        </div>`).join('');

      const canDeliver = isProvider && (st === 'delivered' || (st === 'in_progress' && isFinalStage && o.paymentStatus === 'confirmed'));
      const deliveryHtml = canDeliver ? `
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:6px;">${tr('deliveryTitle')}</div>
          <textarea data-delivery-id="${o.id}" rows="3" dir="auto" placeholder="${tr('deliveryPlaceholder')}" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;background:var(--surface);color:var(--text);">${escapeHtml(o.delivery||'')}</textarea>
          <label class="btn btn-secondary" style="width:auto;padding:8px 14px;margin-top:8px;cursor:pointer;display:inline-block;">${tr('addDeliveryFiles')}<input type="file" multiple data-delivery-file="${o.id}" style="display:none"></label>
          ${fileButtons(true)}
          <button type="button" class="btn btn-secondary" data-action="send-delivery" data-id="${o.id}" style="margin-top:8px;">${tr('sendDelivery')}</button>
        </div>` : ((o.delivery || dFiles.length) ? `
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">${tr('deliveryTitle')}</div>
          ${o.delivery ? `<div style="font-size:13px;white-space:pre-wrap;" dir="auto">${linkifyEsc(o.delivery)}</div>` : ''}
          ${fileButtons(false)}
        </div>` : '');

      return `
        <div class="order-row">
          <div class="order-top">
            <span class="order-service">${escapeHtml(o.serviceName)}</span>
            <span class="status-badge status-${st}">${tr(STATUS_LABELS[st])}</span>
          </div>
          ${orderProgressHtml(st)}
          <div class="order-sub">${isProvider ? tr('clientWord')+': '+escapeHtml(o.clientName) : tr('providerWord')+': '+escapeHtml(o.providerName)} · ${formatPrice(o.price)}</div>
          ${stageHtml}
          <button type="button" class="btn btn-ghost" data-action="open-chat" data-id="${o.id}" style="margin:8px 0;">💬 ${tr('openChat')}</button>
          <button type="button" class="btn btn-ghost" data-action="open-report" data-type="order" data-id="${o.id}" data-name="${escapeHtml(o.serviceName)}" style="margin-bottom:4px;">${tr('reportBtn')}</button>
          ${(!isProvider && st === 'done' && !hasReview(o.id)) ? `<button type="button" class="btn btn-secondary" data-action="open-review" data-id="${o.id}" style="margin-top:6px;">${tr('rateService')}</button>` : ''}
          ${deliveryHtml}
        </div>
      `;
    }

    const placedHtml = placedByMe.length ? placedByMe.map(o=>orderRow(o,false)).join('') : `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-title">${tr('noOrdersTitle')}</div>
        <div class="empty-sub">${tr('noOrdersSub')}</div>
      </div>`;

    const receivedHtml = receivedByMe.length ? `
      <div class="order-section-title">${tr('ordersAsProviderTitle')}</div>
      ${receivedByMe.map(o=>orderRow(o,true)).join('')}
    ` : '';

    return `
      ${renderHeader('myorders')}
      <div class="content">
        <div class="order-section-title">${tr('ordersAsClientTitle')}</div>
        ${placedHtml}
        ${receivedHtml}
      </div>
    `;
  }

  function renderNotifications(){
    const mine = notifications.filter(n=>n.userId===profile.id).sort((a,b)=>b.createdAt-a.createdAt);
    const listHtml = mine.length ? mine.map(n=>`
      <div class="order-row" data-action="open-notification" data-id="${n.id}" style="cursor:pointer;${n.read?'opacity:0.6;':'border-color:var(--primary);'}">
        <div class="order-sub" style="margin-bottom:2px;">${new Date(n.createdAt).toLocaleString(lang==='ar'?'ar-EG':'en-US')}</div>
        <div style="font-size:13.5px;">${escapeHtml(notifText(n))}</div>
      </div>

      <div class="empty">
        <div class="empty-icon">🔔</div>
        <div class="empty-title">${tr('noNotifications')}</div>
      </div>
    `;
    return `
      ${renderHeader('')}
      <div class="content">
        <div class="back-link" data-action="go-home">${tr('backBtn')}</div>
        <div class="detail-title" style="font-size:17px;display:flex;justify-content:space-between;align-items:center;">
          <span>${tr('notificationsTitle')}</span>
          ${mine.length ? `<button class="link-btn" data-action="mark-all-read">${tr('markAllRead')}</button>` : ''}

        ${listHtml}
      </div>
    `;
  }

  function renderReviewForm(){
    const o = orders.find(x=>x.id===reviewOrderId);
    if(!o){ view='myorders'; return renderMyOrders(); }
    const stars = [1,2,3,4,5].map(n=>`
      <span data-action="pick-rating" data-val="${n}" style="font-size:28px;cursor:pointer;${n<=rvRating?'':'opacity:0.3;'}">⭐</span>
    `).join('');
    return `
      ${renderHeader('myorders')}
      <div class="content">
        <div class="back-link" data-action="go-myorders">${tr('backBtn')}</div>
        <div class="detail-title" style="font-size:17px;">${tr('rateService')}: ${escapeHtml(o.serviceName)}</div>
        <div class="field">
          <label>${tr('yourRating')}</label>
          <div>${stars}</div>
        </div>
        <div class="field">
          <label>${tr('commentOptional')}</label>
          <textarea id="rv-comment" style="min-height:70px;">${escapeHtml(rvComment)}</textarea>
        </div>
        <button type="button" class="btn btn-primary" data-action="submit-review">${tr('submitReview')}</button>
      </div>
    `;
  }

  function avatarHtml(size){
    const sz = size || 56;
    const src = profile && profile.avatar;
    if(src) return `<img src="${escapeHtml(src)}" alt="" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;display:block;">`;
    const letter = escapeHtml(((profile && profile.name) || '?').charAt(0));
    return `<span style="display:inline-flex;width:${sz}px;height:${sz}px;border-radius:50%;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(sz*0.42)}px;">${letter}</span>`;
  }
  function accRow(icon, label, action, extra){
    const ic = ICONS[icon] || icon;
    return `<div class="acc-row" data-action="${action}">
      <span class="acc-icon">${ic}</span>
      <span class="acc-label">${label}</span>
      ${extra || ''}
      <span class="acc-chev">${lang==='ar' ? '‹' : '›'}</span>
    </div>`;
  }
  function accPageHead(backAction, title){
    return `
      <div class="back-link" data-action="${backAction}">${tr('backBtn')}</div>
      <div class="detail-title">${title}</div>`;
  }
  function renderAccount(){
    return `
      ${renderHeader('account')}
      <div class="content">
        <div class="profile-hero">
          ${avatarHtml(96)}
          <div class="hero-name">${escapeHtml(profile.name)}</div>
          <div class="hero-mail" dir="ltr">${escapeHtml(profile.email)}</div>
        </div>
        ${accRow('user', tr('accPersonal'), 'go-personal-info')}
        ${accRow('lock', tr('accPrivacy'), 'go-privacy')}
        ${accRow('bell', tr('accNotifs'), 'go-notifications')}
        ${accRow('gear', tr('accSettings'), 'go-app-settings')}
        ${accRow(darkMode ? 'sun' : 'moon', tr('accAppearance'), 'toggle-dark', `<span style="font-size:13px;color:var(--muted);">${tr(darkMode ? 'accDark' : 'accLight')}</span>`)}
        ${accRow('help', tr('accLegal'), 'go-legal')}
        <div data-action="logout" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;margin-top:22px;border:1px solid var(--danger);color:var(--danger);border-radius:var(--radius);font-weight:700;cursor:pointer;">${tr('accLogout')}</div>
      </div>`;
  }
  function renderPersonalInfo(){
    const s = piState || {};
    const av = s.avatar
      ? `<img src="${escapeHtml(s.avatar)}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;">`

          ${av}
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;">
            <label class="btn btn-secondary" style="width:auto;padding:8px 16px;cursor:pointer;margin:0;">${tr(s.avatar ? 'changeImage' : 'chooseImage')}<input type="file" id="avatar-file" accept="image/jpeg,image/png,image/webp" style="display:none"></label>
            ${s.avatar ? `<button type="button" class="link-btn" data-action="pi-remove-avatar">${tr('removeImage')}</button>` : ''}
          </div>
        </div>
        <div class="field"><label>${tr('accName')}</label><input type="text" id="pi-name" value="${escapeHtml(s.name || '')}"></div>
        <div class="field"><label>${tr('accEmail')}</label><input type="text" value="${escapeHtml(profile.email)}" disabled dir="ltr"><div style="font-size:12px;color:var(--muted);margin-top:4px;">${tr('accEmailNote')}</div></div>
        <div class="field"><label>${tr('accPhone')}</label><input type="tel" id="pi-whatsapp" value="${escapeHtml(s.whatsapp || '')}" dir="ltr"></div>
        <div class="field"><label>${tr('accAge')}</label><input type="number" id="pi-age" value="${escapeHtml(String(s.age || ''))}" min="5" max="120" dir="ltr"></div>
        <div class="field"><label>${tr('accCity')}</label><input type="text" id="pi-city" value="${escapeHtml(s.city || '')}"></div>
        <button class="btn btn-primary" data-action="save-personal">${tr('accSave')}</button>
      </div>`;
  }
  function renderPrivacy(){
    return `
      ${renderHeader('account')}
      <div class="content">
        ${accPageHead('go-account', tr('accPrivacy'))}
        ${accRow('key', tr('accChangePwd'), 'go-change-password')}
        ${accRow('lock', tr('logoutAllTitle'), 'logout-all')}

          <span class="acc-icon" style="background:color-mix(in srgb, var(--danger) 12%, transparent);color:var(--danger);">${ICONS.trash}</span><span style="flex:1;">${tr('accDeleteTitle')}</span>
        </div>
      </div>`;

    const s = cpState || {cur:'', nw:'', conf:''};
    return `
      ${renderHeader('account')}
      <div class="content">
        ${accPageHead('go-privacy', tr('accChangePwd'))}

        <div class="field"><label>${tr('accNewPwd')}</label><input type="password" id="cp-new" value="${escapeHtml(s.nw)}" dir="ltr"></div>

    return `
      ${renderHeader('account')}
      <div class="content">
        ${accPageHead('go-privacy', tr('accDeleteTitle'))}

        <button class="btn" data-action="submit-delete-account" style="background:var(--danger);color:#fff;">${tr('accDeleteBtn')}</button>

      <div style="font-weight:800;margin-bottom:6px;">${title}</div>
      ${paragraphs.map(p=>`<p style="margin:0 0 8px;line-height:1.9;color:var(--text);">${p}</p>`).join('')}

      ${renderHeader('account')}

        ${accRow('help', tr('privacyPolicyTitle'), 'go-privacy-policy')}
        ${accRow('help', tr('termsTitle'), 'go-terms')}
      </div>`;

  function renderPrivacyPolicy(){
    const ar = lang === 'ar';
    const body = ar ? [
      legalSection('١. البيانات اللي نجمعها', [
        'الاسم، الإيميل، رقم الواتساب، العمر، المدينة، الصورة الشخصية، والتصنيفات والخدمات والمعرض وطرق الدفع اللي تضيفها، وكذلك الطلبات والرسائل والتقييمات والبلاغات.',

      ]),
      legalSection('٢. كيف نستخدم بياناتك', [
        'لتشغيل الخدمة: عرض خدماتك، وإدارة الطلبات، وإرسال الإشعارات والإيميلات المرتبطة بها، واستعادة كلمة المرور.'
      ]),

  async function uploadAvatarDataUrl(dataUrl){
    const blob = await (await fetch(dataUrl)).blob();
    const up = await api({action:'avatarUploadUrl'});
    if(!up || !up.ok) throw new Error('avatar_url');
    const put = await fetch(up.signedUrl, {method:'PUT', headers:{'content-type':'image/jpeg'}, body: blob});
    if(!put.ok) throw new Error('avatar_put ' + put.status);
    return up.publicUrl;
  }

  function parseDeliveryFiles(v){
    if(!v) return [];
    try{ const a = JSON.parse(v); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  function deriveStatus(o){
    if(o.clientConfirmed && o.providerConfirmed) return 'done';
    if(o.delivery || parseDeliveryFiles(o.deliveryFiles).length) return 'delivered';
    if(o.paymentStage === 'final') return o.paymentStatus === 'confirmed' ? 'in_progress' : 'awaiting_final';
    if(o.paymentStatus === 'confirmed') return 'in_progress';
    if(o.providerApproved && o.clientApproved) return 'awaiting_deposit';
    return 'pending';
  }
  function linkifyEsc(text){
    return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--primary);word-break:break-all;">$1</a>');
  }
  function parsePaymentMethods(v){
    if(!v) return [];
    if(typeof v==='string' && v.charAt(0)==='['){
      try{
        const a = JSON.parse(v);
        return Array.isArray(a) ? a.filter(x=>x && typeof x==='object').map(x=>({type: PM_TYPES.indexOf(x.type)>-1 ? x.type : 'other', name:String(x.name||''), number:String(x.number||'')})) : [];
      }catch(e){ return []; }
    }
    return [{type:'other', name:'', number:String(v)}];
  }

  async function uploadDeliveryFiles(orderId, files){
    const idx = orders.findIndex(o=>o.id===orderId);
    const picked = Array.from(files || []);
    if(idx<0 || !picked.length) return;
    const list = parseDeliveryFiles(orders[idx].deliveryFiles);
    if(list.length + picked.length > 5){ showToast(tr('deliveryMaxFiles')); return; }
    const before = list.length;
    for(const f of picked){
      if(f.size > 20*1024*1024){ showToast(tr('deliveryFileTooBig')); continue; }
      try{
        const up = await api({action:'deliveryUploadUrl', orderId, fileName: f.name});
        if(!up || !up.ok) throw new Error(up && up.error || 'upload_url');
        const put = await fetch(up.signedUrl, {method:'PUT', headers:{'content-type': f.type || 'application/octet-stream'}, body: f});
        if(!put.ok) throw new Error('upload ' + put.status);
        list.push({name: f.name, path: up.path, size: f.size});
      }catch(e){ console.error(e); showToast(tr('networkError')); }
    }
    if(list.length === before) { render(); return; }
    orders[idx].deliveryFiles = JSON.stringify(list);
    notifications.push({id:uid(), userId:orders[idx].clientId, type:'delivery_sent', data:{serviceName:orders[idx].serviceName}, read:false, createdAt:Date.now()});
    await saveOrders();
    await saveNotifications();
    showSuccess(tr('deliveryFilesSaved'));
    render();
  }

  async function updateOrderFlow(orderId, mutate){
    const o = orders.find(x=>x.id===orderId);
    if(!o) return;
    const before = deriveStatus(o);
    mutate(o);
    const after = deriveStatus(o);
    o.status = after;
    if(after !== before){
      const to = (o.clientId === profile.id) ? o.providerId : o.clientId;
      notifications.push({id:uid(), userId:to, type:'status_changed', data:{serviceName:o.serviceName, status:after}, read:false, createdAt:Date.now()});
      await saveNotifications();
    }
    await saveOrders();
    render();
  }

        ${r.details ? `<div style="font-size:13px;margin-top:4px;">${escapeHtml(r.details)}</div>` : ''}
        ${r.status==='reviewed' ? `<div class="status-badge status-done" style="display:inline-block;margin-top:6px;">${tr('reviewedLabel')}</div>` : `
          <button type="button" class="btn btn-secondary" data-action="mark-reviewed" data-id="${r.id}" style="margin-top:8px;">${tr('markReviewed')}</button>
        `}
      </div>
    `).join('') : `<div class="empty"><div class="empty-icon">🚩</div><div class="empty-title">${tr('noReports')}</div></div>`;
    return `
      ${renderHeader('')}
      <div class="content">
        <div class="back-link" data-action="go-home">${tr('backBtn')}</div>
        <div class="detail-title" style="font-size:17px;">${tr('reportsAdminTitle')}</div>
        ${listHtml}
      </div>
    `;
  }


  function renderAdminStats(){
    const freelancersCount = users.filter(u=>u.role==='freelancer').length;
    const clientsCount = users.filter(u=>u.role==='client').length;
    const ordersByStatus = {
      pending: orders.filter(o=>o.status==='pending').length,
      in_progress: orders.filter(o=>o.status==='in_progress').length,
      done: orders.filter(o=>o.status==='done').length,
    };
    const openReportsCount = reports.filter(r=>r.status==='open').length;
    const allTimestamps = [
      ...orders.map(o=>o.createdAt),
      ...messages.map(m=>m.createdAt),
      ...reviews.map(r=>r.createdAt),
    ];
    const lastActivity = allTimestamps.length ? Math.max(...allTimestamps) : null;

    function stat(label, value){
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13.5px;color:var(--muted);">${label}</span>
          <span style="font-size:16px;font-weight:800;color:var(--primary);">${value}</span>
        </div>
      `;
    }

    return `
      ${renderHeader('')}
      <div class="content">
        <div class="back-link" data-action="go-home">${tr('backBtn')}</div>
        <div class="detail-title" style="font-size:17px;">${tr('adminStatsTitle')}</div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;">
          ${stat(tr('totalUsers'), users.length)}
          ${stat(tr('totalFreelancers'), freelancersCount)}
          ${stat(tr('totalClients'), clientsCount)}
          ${stat(tr('totalServices'), services.length)}
          ${stat(tr('totalOrders'), orders.length)}
          ${stat('— ' + tr('statusPending'), ordersByStatus.pending)}
          ${stat('— ' + tr('statusInProgress'), ordersByStatus.in_progress)}
          ${stat('— ' + tr('statusDone'), ordersByStatus.done)}
          ${stat(tr('totalReviews'), reviews.length)}
          ${stat(tr('totalMessages'), messages.length)}
          ${stat(tr('openReportsStat'), openReportsCount)}
        </div>
        <div class="order-section-title">${tr('lastActivityLabel')}</div>
        <div class="empty-sub" style="text-align:center;">
          ${lastActivity ? new Date(lastActivity).toLocaleString(lang==='ar'?'ar-EG':'en-US') : tr('noActivityYet')}
        </div>
      </div>
    `;
  }


  function render(){
    let html = '';

    else if(view==='auth'){ html = renderAuth(); }
    else if(view==='splash'){ html = renderSplash(); }
    else if(view==='loading'){ html = renderLoading(); }
    else if(view==='home'){ html = renderHome(); }
    else if(view==='service-detail'){ html = renderServiceDetail(); }
    else if(view==='myservices'){ html = renderMyServices(); }
    else if(view==='service-form'){ html = renderServiceForm(); }
    else if(view==='myorders'){ html = renderMyOrders(); }
    else if(view==='notifications'){ html = renderNotifications(); }
    else if(view==='review-form'){ html = renderReviewForm(); }
    else if(view==='portfolio'){ html = renderPortfolio(); }
    else if(view==='portfolio-form'){ html = renderPortfolioForm(); }
    else if(view==='provider-profile'){ html = renderProviderProfile(); }
    else if(view==='chat'){ html = renderChat(); }
    else if(view==='report-form'){ html = renderReportForm(); }
    else if(view==='reports-admin'){ html = renderReportsAdmin(); }
    else if(view==='admin-stats'){ html = renderAdminStats(); }
    else if(view==='account'){ html = renderAccount(); }
    else if(view==='personal-info'){ html = renderPersonalInfo(); }
    else if(view==='privacy'){ html = renderPrivacy(); }
    else if(view==='change-password'){ html = renderChangePassword(); }
    else if(view==='app-settings'){ html = renderAppSettings(); }
    else if(view==='delete-account'){ html = renderDeleteAccount(); }
    else if(view==='legal'){ html = renderLegal(); }
    else if(view==='privacy-policy'){ html = renderPrivacyPolicy(); }
    else if(view==='terms'){ html = renderTerms(); }
    if(profile && view!=='auth'){ html += bottomNavHtml(); }
    if(toastMsg){ html += `<div class="toast">${escapeHtml(toastMsg)}</div>`; }
    const _pageChanged = window.__mv !== view; window.__mv = view; root.dataset.anim = _pageChanged ? '1' : '0';
    root.innerHTML = html;
    attachDynamicListeners();
    attachAccountListeners();
  }

  function attachDynamicListeners(){
    const searchInput = document.getElementById('search-input');
    if(searchInput){ searchInput.addEventListener('input', (e)=>{ searchQuery = e.target.value; render(); }); }

    const an = document.getElementById('auth-name'); if(an) an.addEventListener('input', e=>authName=e.target.value);
    const ae = document.getElementById('auth-email'); if(ae) ae.addEventListener('input', e=>authEmail=e.target.value);
    const ap = document.getElementById('auth-password'); if(ap) ap.addEventListener('input', e=>authPassword=e.target.value);
    const ac = document.getElementById('auth-confirm'); if(ac) ac.addEventListener('input', e=>authConfirmPassword=e.target.value);
    const aw = document.getElementById('auth-whatsapp'); if(aw) aw.addEventListener('input', e=>authWhatsapp=e.target.value);
    const rse = document.getElementById('rs-email'); if(rse) rse.addEventListener('input', e=>rsEmail=e.target.value);
    const rsnp = document.getElementById('rs-newpass'); if(rsnp) rsnp.addEventListener('input', e=>rsNewPassword=e.target.value);
    const rscp = document.getElementById('rs-confirmpass'); if(rscp) rscp.addEventListener('input', e=>rsConfirmPassword=e.target.value);

    const sfNameEl = document.getElementById('sf-name'); if(sfNameEl) sfNameEl.addEventListener('input', e=>sfName=e.target.value);
    const sfCatEl = document.getElementById('sf-category'); if(sfCatEl) sfCatEl.addEventListener('change', e=>{ sfCategory=e.target.value; render(); });
    const sfCustomEl = document.getElementById('sf-custom-cat'); if(sfCustomEl) sfCustomEl.addEventListener('input', e=>sfCustomCat=e.target.value);
    const sfPriceEl = document.getElementById('sf-price');
    if(sfPriceEl) sfPriceEl.addEventListener('input', e=>{ sfPrice = e.target.value.replace(/[^0-9]/g,''); e.target.value = sfPrice; });
    const sfFileEl = document.getElementById('sf-image-file');
    if(sfFileEl) sfFileEl.addEventListener('change', async e=>{
      await addImagesFrom(e.target, sfImages);
    });
    const rvCommentEl = document.getElementById('rv-comment'); if(rvCommentEl) rvCommentEl.addEventListener('input', e=>rvComment=e.target.value);

    const pfTitleEl = document.getElementById('pf-title'); if(pfTitleEl) pfTitleEl.addEventListener('input', e=>pfTitle=e.target.value);
    const pfDescEl = document.getElementById('pf-desc'); if(pfDescEl) pfDescEl.addEventListener('input', e=>pfDesc=e.target.value);
    const pfLinkEl = document.getElementById('pf-link'); if(pfLinkEl) pfLinkEl.addEventListener('input', e=>pfLink=e.target.value);
    const pfFileEl = document.getElementById('pf-image-file');
    if(pfFileEl) pfFileEl.addEventListener('change', async e=>{
      await addImagesFrom(e.target, pfImages);
    });
    const chatInputEl = document.getElementById('chat-input'); if(chatInputEl) chatInputEl.addEventListener('input', e=>chatText=e.target.value);
    const pmInfoEl = document.getElementById('pm-info'); if(pmInfoEl) pmInfoEl.addEventListener('input', e=>pmInfoDraft=e.target.value);
    const rpReasonEl = document.getElementById('rp-reason'); if(rpReasonEl) rpReasonEl.addEventListener('change', e=>rpReason=e.target.value);
    const rpDetailsEl = document.getElementById('rp-details'); if(rpDetailsEl) rpDetailsEl.addEventListener('input', e=>rpDetails=e.target.value);
    document.querySelectorAll('.payment-ref-input').forEach(el=>{
      el.addEventListener('input', e=>{ paymentRefDrafts[el.getAttribute('data-order-id')] = e.target.value; });
    });
    const sfDescEl = document.getElementById('sf-desc');
    const sfWc = document.getElementById('sf-wordcount');
    if(sfDescEl){
      sfDescEl.addEventListener('input', e=>{
        sfDesc = e.target.value;
        if(sfWc){
          const wc = wordCount(sfDesc);
          sfWc.textContent = wc + ' / ' + MIN_DESC_WORDS + ' ' + tr('wordsUnit');
          sfWc.className = 'word-count ' + (wc>=MIN_DESC_WORDS ? 'ok' : 'low');
        }
      });
    }
  }

  root.addEventListener('click', async (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.getAttribute('data-action');

    if(action==='logout'){ logout(); }
    else if(action==='toggle-lang'){ toggleLang(); }
    else if(action==='toggle-dark'){ toggleDark(); }
    else if(action==='toggle-auth-mode'){
      authMode = authMode==='login' ? 'signup' : 'login';
      authPassword=''; authConfirmPassword='';
      render();
    }
    else if(action==='go-reset-password'){
      authMode='reset'; resetStage='email'; rsEmail=''; rsNewPassword=''; rsConfirmPassword='';
      render();
    }
    else if(action==='reset-continue'){
      const email = rsEmail.trim();
      if(!isValidEmail(email)){ showToast(tr('invalidEmail')); return; }
      try{ await api({action:'requestReset', email}); showToast(tr('resetEmailSent')); }
      catch(e){ showToast(tr('networkError')); }
    }
    else if(action==='reset-submit'){
      if(rsNewPassword.length<6){ showToast(tr('shortPassword')); return; }
      if(rsNewPassword!==rsConfirmPassword){ showToast(tr('passwordMismatch')); return; }
      let res;
      try{
        const hash = await hashPassword(rsEmail, rsNewPassword);
        res = await api({action:'resetPassword', resetToken, passwordHash:hash});
      }catch(e){ showToast(tr('networkError')); return; }
      if(!res || !res.ok){ showToast(tr('resetLinkInvalid')); return; }
      showToast(tr('passwordResetSuccess'));
      authEmail = rsEmail; authPassword = '';
      resetToken=''; rsNewPassword=''; rsConfirmPassword='';
      authMode='login';
      render();
    }
    else if(action==='sf-remove-image'){ sfImages.splice(Number(t.getAttribute('data-idx')),1); render(); }
    else if(action==='pf-remove-image'){ pfImages.splice(Number(t.getAttribute('data-idx')),1); render(); }
    else if(action==='go-account'){ view='account'; render(); }
    else if(action==='go-personal-info'){ piState={name:profile.name||'', whatsapp:profile.whatsapp||'', age:profile.age||'', city:profile.city||'', avatar:profile.avatar||''}; view='personal-info'; render(); }
    else if(action==='go-privacy'){ view='privacy'; render(); }
    else if(action==='go-change-password'){ cpState={cur:'', nw:'', conf:''}; view='change-password'; render(); }
    else if(action==='go-app-settings'){ view='app-settings'; render(); }
    else if(action==='pi-remove-avatar'){ piState.avatar=''; render(); }
    else if(action==='save-personal'){ await savePersonal(); }
    else if(action==='submit-change-password'){ await submitChangePassword(); }
    else if(action==='go-delete-account'){ daState={pw:''}; view='delete-account'; render(); }
    else if(action==='go-legal'){ view='legal'; render(); }
    else if(action==='logout-all'){
      if(!confirm(tr('confirmLogoutAll'))) return;
      try{
        const r = await api({action:'logoutAll'});
        if(r && r.ok){ showToast(tr('loggedOutAll')); logout(); }
        else showToast(tr('networkError'));
      }catch(e){ showToast(tr('networkError')); }
    }
    else if(action==='go-privacy-policy'){ view='privacy-policy'; render(); }
    else if(action==='go-terms'){ view='terms'; render(); }
    else if(action==='submit-delete-account'){ await deleteAccount(); }
    else if(action==='pick-role'){ authRole = t.getAttribute('data-role'); render(); }
    else if(action==='login-submit'){
      const email = authEmail.trim();
      const password = authPassword;
      if(!isValidEmail(email)){ showToast(tr('invalidEmail')); return; }
      if(!password){ showToast(tr('shortPassword')); return; }
      const hash = await hashPassword(email, password);
      let res;
      try{ res = await api({action:'login', email, passwordHash:hash}); }
      catch(e){ showToast(tr('networkError')); return; }
      if(!res || !res.ok){ showToast(tr('wrongCredentials')); return; }
      profile = res.user;
      authToken = res.token || ''; await saveSession(res.user.id, res.user.email, authToken);
      try{ await fetchAll(); lastFetch = Date.now(); }catch(e){}
      authEmail=''; authPassword='';
      startSplash();
    }
    else if(action==='signup-submit'){
      const name = authName.trim();
      const email = authEmail.trim();
      const password = authPassword;
      const confirm = authConfirmPassword;
      if(!name){ showToast(tr('fillName')); return; }
      if(!isValidEmail(email)){ showToast(tr('invalidEmail')); return; }
      if(password.length<6){ showToast(tr('shortPassword')); return; }
      if(password!==confirm){ showToast(tr('passwordMismatch')); return; }
      const hash = await hashPassword(email, password);
      const newUser = {id:uid(), name, email, passwordHash:hash, whatsapp:authWhatsapp.trim(), role:authRole};
      let res;
      try{ res = await api({action:'register', user:newUser}); }
      catch(e){ showToast(tr('networkError')); return; }
      if(!res || !res.ok){ showToast(res && res.error==='EMAIL_EXISTS' ? tr('emailTaken') : tr('networkError')); return; }
      profile = res.user;
      authToken = res.token || ''; await saveSession(res.user.id, res.user.email, authToken);
      try{ await fetchAll(); lastFetch = Date.now(); }catch(e){}
      authName='';authEmail='';authPassword='';authConfirmPassword='';authWhatsapp='';authRole='client';
      startSplash();
    }
    else if(action==='go-home'){ view='home'; render(); }
    else if(action==='go-myservices'){ pmDraft = parsePaymentMethods(profile.paymentInfo).slice(0,5); view='myservices'; render(); }
    else if(action==='go-myorders'){ view='myorders'; render(); }
    else if(action==='filter-cat'){ filterCategory = t.getAttribute('data-cat'); render(); }
    else if(action==='open-service'){ selectedServiceId = t.getAttribute('data-id'); view='service-detail'; render(); }
    else if(action==='pm-add'){ if(pmDraft.length<5){ pmDraft.push({type:'bank', name:'', number:''}); render(); } }
    else if(action==='pm-remove'){ pmDraft.splice(Number(t.getAttribute('data-idx')),1); render(); }
    else if(action==='save-payment-info'){
      const cleaned = pmDraft.map(m=>({type:m.type, name:(m.name||'').trim(), number:(m.number||'').trim()})).filter(m=>m.name||m.number);
      profile.paymentInfo = cleaned.length ? JSON.stringify(cleaned) : '';
      pmDraft = cleaned;
      await saveUsers();
      showSuccess(tr('savedSuccess'));
    }
    else if(action==='add-service-form'){
      editingServiceId=null; sfName=''; sfCategory=CATEGORIES[0].id; sfCustomCat=''; sfPrice=''; sfDesc=''; sfImages=[];
      view='service-form'; render();
    }
    else if(action==='edit-service'){
      editingServiceId = t.getAttribute('data-id');
      const s = services.find(x=>x.id===editingServiceId);
      sfName=s.name; sfCustomCat = String(s.category||'').startsWith('custom:') ? String(s.category).slice(7) : ''; sfCategory = sfCustomCat ? 'other' : s.category; sfPrice=String(s.price); sfDesc=s.description; sfImages=imagesOf(s).slice();
      view='service-form'; render();
    }
    else if(action==='delete-service'){
      if(!confirm(tr('confirmDeleteService'))) return;
      services = services.filter(s=>s.id!==t.getAttribute('data-id'));
      view = 'myservices';
      await saveServices();
      render();
      showToast(tr('deletedService'));
    }
    else if(action==='save-service'){
      const name = sfName.trim();
      let category = sfCategory;
      if(category === 'other'){
        const cn = sfCustomCat.trim();
        if(!cn){ showToast(tr('fillCustomCat')); return; }
        category = 'custom:' + cn.slice(0, 40);
      }
      const price = Number(sfPrice);
      const description = sfDesc.trim();
      const images = sfImages.slice(0, MAX_IMAGES);
      if(!name){ showToast(tr('fillServiceName')); return; }
      if(!description){ showToast(tr('fillDesc')); return; }
      if(wordCount(description) < MIN_DESC_WORDS){ showToast(tr('descTooShort')); return; }
      if(!price || isNaN(price)){ showToast(tr('fillPrice')); return; }

      if(editingServiceId){
        const idx = services.findIndex(s=>s.id===editingServiceId);
        services[idx] = {...services[idx], name, category, price, description, images, image: images[0]||''};
      } else {
        services.push({
          id: uid(), name, category, price, description, images, image: images[0]||'',
          ownerId: profile.id, ownerName: profile.name, ownerWhatsapp: profile.whatsapp || ''
        });
      }
      await saveServices();
      editingServiceId = null;
      sfName='';sfCategory=CATEGORIES[0].id;sfCustomCat='';sfPrice='';sfDesc='';sfImages=[];
      view = 'myservices';
      render();
      showSuccess(tr('savedSuccess'));
    }
    else if(action==='place-order'){
      const s = services.find(x=>x.id===t.getAttribute('data-id'));
      if(!s) return;
      const newOrder = {
        id: uid(), serviceId:s.id, serviceName:s.name, price:s.price,
        clientId: profile.id, clientName: profile.name, clientWhatsapp: profile.whatsapp||'',
        providerId: s.ownerId, providerName: s.ownerName, providerWhatsapp: s.ownerWhatsapp||'',
        status:'pending', paymentStatus:'not_paid', paymentReference:'', createdAt: Date.now()
      };
      orders.push(newOrder);
      notifications.push({id:uid(), userId:s.ownerId, type:'new_order', data:{serviceName:s.name}, read:false, createdAt:Date.now()});
      await saveOrders();
      await saveNotifications();
      view = 'myorders';
      render();
      showToast(tr('orderSuccess'));
    }
    else if(action==='go-portfolio'){ view='portfolio'; render(); }
    else if(action==='add-portfolio-form'){
      editingPortfolioId=null; pfTitle=''; pfDesc=''; pfLink=''; pfImages=[];
      view='portfolio-form'; render();
    }
    else if(action==='edit-portfolio'){
      editingPortfolioId = t.getAttribute('data-id');
      const p = (profile.portfolio||[]).find(x=>x.id===editingPortfolioId);
      if(p){ pfTitle=p.title; pfDesc=p.description; pfLink=p.link||''; pfImages=imagesOf(p).slice(); }
      view='portfolio-form'; render();
    }
    else if(action==='delete-portfolio'){
      profile.portfolio = (profile.portfolio||[]).filter(p=>p.id!==t.getAttribute('data-id'));
      await saveUsers();
      render();
      showToast(tr('deletedService'));
    }
    else if(action==='save-portfolio'){
      const title = pfTitle.trim();
      const description = pfDesc.trim();
      const link = pfLink.trim();
      const images = pfImages.slice(0, MAX_IMAGES);
      if(!title){ showToast(tr('fillPortfolioTitle')); return; }
      if(!Array.isArray(profile.portfolio)) profile.portfolio = [];
      if(editingPortfolioId){
        const idx = profile.portfolio.findIndex(p=>p.id===editingPortfolioId);
        if(idx>-1) profile.portfolio[idx] = {...profile.portfolio[idx], title, description, link, images, image: images[0]||''};
      } else {
        profile.portfolio.push({id:uid(), title, description, link, images, image: images[0]||''});
      }
      await saveUsers();
      editingPortfolioId=null; pfTitle='';pfDesc='';pfLink='';pfImages=[];
      view='portfolio';
      render();
      showSuccess(tr('savedSuccess'));
    }
    else if(action==='open-profile'){
      viewingProviderId = t.getAttribute('data-id');
      view='provider-profile';
      render();
    }
    else if(action==='del-delivery-file'){
      const orderId = t.getAttribute('data-id');
      const i = Number(t.getAttribute('data-idx'));
      const idx = orders.findIndex(o=>o.id===orderId);
      if(idx>-1){
        const list = parseDeliveryFiles(orders[idx].deliveryFiles);
        list.splice(i,1);
        orders[idx].deliveryFiles = JSON.stringify(list);
        await saveOrders();
        render();
      }
    }
    else if(action==='dl-delivery-file'){
      try{
        const r = await api({action:'deliveryDownloadUrl', path: t.getAttribute('data-path')});
        if(r && r.ok) window.open(r.url, '_blank', 'noopener');
        else showToast(tr('networkError'));
      }catch(e){ showToast(tr('networkError')); }
    }
    else if(action==='send-delivery'){
      const orderId = t.getAttribute('data-id');
      const el = document.querySelector(`[data-delivery-id="${orderId}"]`);
      const text = (el ? el.value : '').trim();
      if(!text){ showToast(tr('deliveryEmpty')); return; }
      const idx = orders.findIndex(o=>o.id===orderId);
      if(idx>-1){
        orders[idx].delivery = text;
        notifications.push({id:uid(), userId:orders[idx].clientId, type:'delivery_sent', data:{serviceName:orders[idx].serviceName}, read:false, createdAt:Date.now()});
        await saveOrders();
        await saveNotifications();
        showSuccess(tr('deliverySent'));
        render();
      }
    }
    else if(action==='approve-order'){
      const orderId = t.getAttribute('data-id');
      const el = document.querySelector(`[data-deposit-id="${orderId}"]`);
      const dep = Math.round(Number(el ? el.value : 0));
      const cur = orders.find(o=>o.id===orderId);
      if(!cur || !(dep > 0) || dep > Number(cur.price)){ showToast(tr('depositInvalid')); return; }
      await updateOrderFlow(orderId, o=>{ o.deposit = dep; o.providerApproved = true; });
      showToast(tr('orderApprovedToast'));
    }
    else if(action==='client-approve'){
      await updateOrderFlow(t.getAttribute('data-id'), o=>{ o.clientApproved = true; });
    }
    else if(action==='request-final'){
      await updateOrderFlow(t.getAttribute('data-id'), o=>{ o.paymentStage = 'final'; o.paymentStatus = 'not_paid'; o.paymentReference = ''; });
      showToast(tr('finalRequestedToast'));
    }
    else if(action==='client-confirm'){
      await updateOrderFlow(t.getAttribute('data-id'), o=>{ o.clientConfirmed = true; });
    }
    else if(action==='provider-confirm'){
      await updateOrderFlow(t.getAttribute('data-id'), o=>{ o.providerConfirmed = true; });
    }
    else if(action==='submit-payment'){
      const orderId = t.getAttribute('data-id');
      const ref = (paymentRefDrafts[orderId] || '').trim();
      if(!ref){ showToast(tr('fillReference')); return; }
      const idx = orders.findIndex(o=>o.id===orderId);
      if(idx>-1){
        orders[idx].paymentStatus = 'awaiting_confirmation';
        orders[idx].paymentReference = ref;
        notifications.push({id:uid(), userId:orders[idx].providerId, type:'payment_submitted', data:{serviceName:orders[idx].serviceName}, read:false, createdAt:Date.now()});
        await saveOrders();
        await saveNotifications();
        delete paymentRefDrafts[orderId];
        render();
        showToast(tr('paymentSubmittedToast'));
      }
    }
    else if(action==='confirm-payment'){
      const orderId = t.getAttribute('data-id');
      const idx = orders.findIndex(o=>o.id===orderId);
      if(idx>-1){
        orders[idx].paymentStatus = 'confirmed';
        orders[idx].status = deriveStatus(orders[idx]);
        notifications.push({id:uid(), userId:orders[idx].clientId, type:'payment_confirmed', data:{serviceName:orders[idx].serviceName}, read:false, createdAt:Date.now()});
        await saveOrders();
        await saveNotifications();
        render();
        showToast(tr('paymentConfirmedToast'));
      }
    }
    else if(action==='open-chat'){
      chatOrderId = t.getAttribute('data-id');
      chatText='';
      view='chat';
      render();
    }
    else if(action==='send-message'){
      const inputEl = document.getElementById('chat-input');
      const text = (chatText || (inputEl?inputEl.value:'')).trim();
      if(!text) return;
      const o = orders.find(x=>x.id===chatOrderId);
      if(!o) return;
      const otherId = profile.id===o.clientId ? o.providerId : o.clientId;
      messages.push({id:uid(), orderId:o.id, senderId:profile.id, senderName:profile.name, text, createdAt:Date.now()});
      notifications.push({id:uid(), userId:otherId, type:'new_message', data:{senderName:profile.name, serviceName:o.serviceName, orderId:o.id}, read:false, createdAt:Date.now()});
      await saveMessages();
      await saveNotifications();
      chatText='';
      render();
    }
    else if(action==='go-notifications'){ view='notifications'; render(); }
    else if(action==='open-report'){
      reportTargetType = t.getAttribute('data-type');
      reportTargetId = t.getAttribute('data-id');
      reportTargetName = t.getAttribute('data-name');
      rpReason = REPORT_REASONS[0].id; rpDetails='';
      view = 'report-form';
      render();
    }
    else if(action==='submit-report'){
      const reasonEl = document.getElementById('rp-reason');
      const detailsEl = document.getElementById('rp-details');
      const reason = reasonEl ? reasonEl.value : rpReason;
      const details = detailsEl ? detailsEl.value.trim() : rpDetails.trim();
      reports.push({
        id: uid(), reporterId: profile.id, reporterName: profile.name,
        targetType: reportTargetType, targetId: reportTargetId, targetName: reportTargetName,
        reason, details, status:'open', createdAt: Date.now()
      });
      await saveReports();
      reportTargetType=null; reportTargetId=null; reportTargetName=null; rpDetails='';
      view = 'home';
      render();
      showToast(tr('reportSubmitted'));
    }
    else if(action==='go-reports-admin'){ view='reports-admin'; render(); }
    else if(action==='go-admin-stats'){ view='admin-stats'; render(); }
    else if(action==='mark-reviewed'){
      const r = reports.find(x=>x.id===t.getAttribute('data-id'));
      if(r){ r.status='reviewed'; await saveReports(); render(); }
    }
    else if(action==='mark-all-read'){
      notifications.forEach(n=>{ if(n.userId===profile.id) n.read=true; });
      await saveNotifications();
      render();
    }
    else if(action==='open-notification'){
      const n = notifications.find(x=>x.id===t.getAttribute('data-id'));
      if(!n) return;
      if(!n.read){ n.read = true; await saveNotifications(); }
      if(n.type==='new_review' && n.data.serviceId){ selectedServiceId = n.data.serviceId; view='service-detail'; }
      else if(n.type==='new_message' && n.data.orderId){ chatOrderId = n.data.orderId; view='chat'; }
      else { view = 'myorders'; }
      render();
    }
    else if(action==='open-review'){
      reviewOrderId = t.getAttribute('data-id');
      rvRating = 5; rvComment = '';
      view = 'review-form';
      render();
    }
    else if(action==='pick-rating'){ rvRating = Number(t.getAttribute('data-val')); render(); }
    else if(action==='submit-review'){
      const o = orders.find(x=>x.id===reviewOrderId);
      if(!o) return;
      const commentEl = document.getElementById('rv-comment');
      const comment = commentEl ? commentEl.value.trim() : '';
      reviews.push({id:uid(), serviceId:o.serviceId, orderId:o.id, clientId:profile.id, clientName:profile.name, rating:rvRating, comment, createdAt:Date.now()});
      notifications.push({id:uid(), userId:o.providerId, type:'new_review', data:{serviceName:o.serviceName, rating:rvRating, serviceId:o.serviceId}, read:false, createdAt:Date.now()});
      await saveReviews();
      await saveNotifications();
      reviewOrderId = null; rvRating=5; rvComment='';
      view = 'myorders';
      render();
      showToast(tr('reviewSubmitted'));
    }
  });

  root.addEventListener('change', async (e)=>{
    const dfIn = e.target.closest ? e.target.closest('[data-delivery-file]') : null;
    if(dfIn){ await uploadDeliveryFiles(dfIn.getAttribute('data-delivery-file'), dfIn.files); return; }
    const t = e.target.closest('[data-action="update-status"]');
    if(!t) return;
    const id = t.getAttribute('data-id');
    const idx = orders.findIndex(o=>o.id===id);
    if(idx>-1){
      orders[idx].status = t.value;
      notifications.push({id:uid(), userId:orders[idx].clientId, type:'status_changed', data:{serviceName:orders[idx].serviceName, status:t.value}, read:false, createdAt:Date.now()});
      await saveOrders();
      await saveNotifications();
      showToast(tr('statusUpdated'));
    }
  });

  loadAll();
})();
</script>
</body>
</html>
